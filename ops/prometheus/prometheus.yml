# Scrapes the API. Used by docker-compose.observability.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: it-ticketing-api
    metrics_path: /api/metrics
    # Written from METRICS_TOKEN by the Prometheus container's start command.
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ['app:5000']
