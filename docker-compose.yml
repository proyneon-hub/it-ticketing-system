# Runs the whole stack locally:  docker compose up --build --wait
# Then load demo tickets:        docker compose run --rm seed
# Open http://localhost:5000 and sign in with a demo account.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # A one-node replica set, because the API uses multi-document transactions and
    # MongoDB only supports those on a replica set (Atlas already is one).
    command: ['--replSet', 'rs0', '--bind_ip_all']
    # Published on localhost only; the app reaches it over the compose network.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Healthy only once this node is the elected primary. The first run also
      # initiates the replica set, which is why the check does more than ping.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "let ok = false; try { ok = rs.status().myState === 1; } catch (e) { try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); } catch (e2) {} } quit(ok ? 0 : 1);"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: it-ticketing-system:local
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # The refresh cookie is Secure by default in production, and browsers only send a
      # Secure cookie over https. This stack is plain http://localhost, so it opts out.
      COOKIE_SECURE: 'false'
      # Demo default (32+ characters, which production mode requires) so compose works
      # out of the box. Set AUTH_SECRET for anything shared.
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-demo-secret-do-not-reuse}
      MONGODB_URI: mongodb://mongo:27017/it_ticketing?replicaSet=rs0
      # Enables POST /api/jobs/* for a scheduler (32+ characters). Unset, the jobs are off.
      CRON_SECRET: ${CRON_SECRET:-}
      # Notifications (Discord, Slack or any JSON endpoint). Unset, nothing is recorded or sent.
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # The service desk agent. Off unless AGENT_ENABLED=true; the app only records events for it.
      AGENT_ENABLED: ${AGENT_ENABLED:-}
    ports:
      - '5000:5000'
    # Health is defined by the image's HEALTHCHECK (/api/ready).

  # One-shot job that replaces the tickets with a known demo data set.
  seed:
    image: it-ticketing-system:local
    profiles: ['seed']
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/it_ticketing?replicaSet=rs0
    command: ['node', 'dist-server/scripts/seed.js']

  # Runs the scheduled jobs (SLA escalation and webhook delivery) on a timer, so a container
  # deployment needs no external scheduler:  docker compose --profile worker up worker
  worker:
    image: it-ticketing-system:local
    profiles: ['worker']
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/it_ticketing?replicaSet=rs0
      # Notifications are off unless a webhook is set: WEBHOOK_URL=https://discord.com/api/webhooks/...
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # The service desk agent runs here. Off unless AGENT_ENABLED=true (also set on the app, which
      # records the events). It mints a token for each run, so it needs the app's AUTH_SECRET, and it
      # reaches the ticketing API at the app's address. Needs a real ANTHROPIC_API_KEY.
      AGENT_ENABLED: ${AGENT_ENABLED:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_DEFAULT_MODE: ${AGENT_DEFAULT_MODE:-}
      AGENT_DAILY_COST_CAP_USD: ${AGENT_DAILY_COST_CAP_USD:-}
      AGENT_API_BASE_URL: http://app:5000
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-demo-secret-do-not-reuse}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-30000}
    command: ['node', '--enable-source-maps', 'dist-server/scripts/worker.js']

volumes:
  mongo-data:
