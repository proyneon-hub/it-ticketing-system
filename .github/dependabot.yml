version: 2

# Weekly, grouped update pull requests keep dependencies current without a flood
# of one-package PRs. CI (tests, lint, audit) gates every one of them.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # typescript-eslint (which lints all the TypeScript) does not support TypeScript 7 yet:
    # https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # react, react-dom and their types must move together: a bump of only some of them
      # leaves a peer-dependency conflict that fails `npm ci`.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /Support-Ops-Automation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
